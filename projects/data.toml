[[project]]
name = "Quic-Poker"
desc = "Quic-Poker is a multi-player card game server built on QUIC, using quinn, a Rust implementation of the protocol. Split across core game logic, protocol, networking, server and client crates, it handles lobbies, chip stacks with side pots, and per-account PnL tracking."
tags = ["Rust", "QUIC", "Tokio", "Networking"]
links = [
    { name = "Source", url = "https://github.com/differental/quic-poker/" },
]

[[project]]
name = "TimeTracker"
desc = "TimeTracker is a personal time tracker served as a JSON API, written in Rust with Axum and an embedded sled database. It is designed for personal use, but its configuration is exposed so that it can be self-hosted."
tags = ["Rust", "Axum", "sled", "API"]
links = [
    { name = "Source", url = "https://github.com/differental/TimeTracker/" },
]

[[project]]
name = "LinkedVector-rs"
desc = "LinkedVector-rs is an experimental data structure that aims to increase cache hits when using linked lists. Nodes keep their next-pointers but live inside a contiguous Vec alongside a freelist of vacated indices, giving O(1) deletion without the cache misses of a linked list. It is benchmarked against both Vec and LinkedList."
tags = ["Rust", "Data Structures", "Benchmarking"]
links = [
    { name = "Benchmarks", url = "https://differental.github.io/LinkedVector-rs/report/" },
    { name = "Source", url = "https://github.com/differental/LinkedVector-rs/" },
]

[[project]]
name = "IDP"
desc = "The Integrated Design Project (IDP) is a group coursework project involving designing and coding in Python an Automated Guided Vehicle (AGV) to complete tasks around a table. Together with a teammate, I was responsible for the software that powers the Raspberry Pi Pico."
